name: SOW Diagnostic

on:
  push:
    branches:
      - 'enhancement/v0.3.2-mep-sow'
  pull_request:
    branches:
      - 'work/v0.3.0-cip-build'

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements-dev.txt
      - name: SOW role prepare finalize assign and queue
        run: PYTHONPATH=. pytest -q tests/test_zzza_sow_queue.py
