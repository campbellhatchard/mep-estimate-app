name: SOW v0.3.2 Staging Gate

on:
  push:
    branches:
      - 'enhancement/v0.3.2-mep-sow'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate full migration chain
        run: |
          rm -f /tmp/mep_estimate_sow_gate.db
          DATABASE_URL=sqlite:////tmp/mep_estimate_sow_gate.db PYTHONPATH=. alembic upgrade head
      - name: Run complete MEP CIP and SOW regression suite
        run: PYTHONPATH=. pytest -q
      - name: Promote only a green build to Render staging branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr ready 5
          gh pr merge 5 --repo ${{ github.repository }} --merge
