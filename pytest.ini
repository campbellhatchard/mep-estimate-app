[pytest]
markers =
    e2e: real-browser end-to-end tests against an isolated local application
    smoke: fast release-critical browser smoke tests
    release: broader release-critical browser tests
filterwarnings =
    error:.*on_event is deprecated.*:DeprecationWarning
    error:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning
    error:.*TemplateResponse.*first parameter anymore.*:DeprecationWarning
    error:Identity map already had an identity.*:sqlalchemy.exc.SAWarning
